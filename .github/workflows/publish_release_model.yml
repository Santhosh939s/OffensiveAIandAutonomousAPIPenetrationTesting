name: Publish Fine-Tuned GGUF Model to GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to attach model to'
        required: true
        default: 'v1.0.0'

jobs:
  upload_model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Fine-Tuned GGUF Model
        run: |
          echo "Downloading Qwen2.5-1.5B Q4_K_M GGUF from cloud storage..."
          curl -L -o "qwen2.5-1.5b-offensive-ai.Q4_K_M.gguf" "https://www.kaggleusercontent.com/kf/365291335/eyJhbGciOiJkaXIiLCJlbmMiOiJBMTI4Q0JDLUhTMjU2In0.._w2G7eEhg98tuDfOQCn8lw.PKLrefxO8xbMEWgpxI7_zCVz4DnuMlU6eh8SJ3ckCzNAm2-_wU5PJglah3Z3aVwpYakSn4cWyOIoWzhYywEF4KrPp08ew-eK6ghQb0z-qx5AMnFqCBfNEXxkDqTa7a5JrPM3XCxuCT-OtNoH722OMnwJx7Asv7kJFxNuqOP_xxpyEKs7OstlvAJ5z3wMoDwOw-HwM5Ma_urDtb-jyy02Ob8diGZMxvazHDXuwjODb7WMPXdHL7vzUz17sBv7IHNNqGKxVD8i5bKT-WGbp8PZh73sXWmIBUcgi7PjUKlwGu7RxaQIRkArmYe9uHfCjaA77GgtE8ujUFXB7vVRVadfiAUdoOf9gWH5RgWiNXha0YVjhZYSFhk2MBRMqMnUoGjnHpYJLwEg9Z5B4xLz_x_VYwAdfkJp-fAmwrGsuKE147unQPjcuA3zfSlGhD-EiOmU3SeP9iOyJN8-4GZt2Gohc2nxxe0Jrzc7_bmBmwmUMnsDQRq_ob7LDfGUC81qs2JcjJdTFETkTHj2YhOz_IoFNKbNQEi5L1KyRgBB4wrsu3FuNr8e_JBgrnmiH_Cx4pUABFOMGzwJUTOf3XrbKUGm5gWIwrUfDPcpvxjqw9-bERyXo0haGHM1VcUY4sSlFmer.hnGzFdHvNwuOc-r0NZDozw/qwen2.5-1.5b-offensive-ai.Q4_K_M.gguf"

      - name: Cryptographic Verification (SHA-256)
        run: |
          EXPECTED="cd7dc83335b02d90f44a7fe4bd0f06eea4d64deb429710f238fe8c5de3da4dc5"
          ACTUAL=$(sha256sum qwen2.5-1.5b-offensive-ai.Q4_K_M.gguf | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum verification failed!"
            exit 1
          fi
          echo "Bit-for-bit checksum verified successfully!"

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.release_tag }} qwen2.5-1.5b-offensive-ai.Q4_K_M.gguf --clobber
